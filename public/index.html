<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>블로그매니저</title><style>

</style><header><div><h1>블로그매니저 <span style="color:#7fc6b0;font-size:13px">GOLDRIVER</span></h1><p>오늘 계획하고, 꾸준히 쌓는 나의 블로그</p></div><button onclick="backup()">백업 다운로드</button></header><main><div class="notice">원고와 일정은 이 브라우저에 저장됩니다. 네이버 자동 게시·예약 등록은 아직 연결되지 않았습니다. 일정 저장과 네이버 예약 완료를 구분해 관리합니다.</div><div class="stats" id="stats"></div><nav id="nav"></nav><div id="view"></div></main><div id="toast" role="status"></div><script>
const titles=['음식을 잘한다고 음식장사를 잘하는 것은 아닙니다','내 손님은 누구인가','전문점과 여러 메뉴 매장, 무엇을 선택할까','매출보다 남는 돈이 중요합니다','대학가·주거지·오피스 상권의 차이','좋은 자리보다 감당할 수 있는 임대료','작은 매장의 좌석과 동선','매장 계약 전에 확인할 것','대표 메뉴 하나를 만드는 법','메뉴가 많으면 생기는 문제','식재료 원가 계산하기','판매가격과 세트메뉴 구성','레시피를 숫자로 기록하기','준비조리와 주문 후 조리 나누기','재고·보관·폐기 관리','청결과 위생을 일상 업무로 만들기','손님은 맛 외에 무엇을 보는가','불만 손님 대응의 기본','할인보다 재방문 이유 만들기','네이버·인스타·블로그의 역할','매일 기록해야 할 숫자','인건비와 근무표 관리','안 팔리는 메뉴와 적자 시간대 정리','두 번째 매장을 내기 전 확인할 것'];
let data;try{data=JSON.parse(localStorage.getItem('blog-manager-v1'))}catch{}if(!data||!Array.isArray(data.posts))data={blogs:[{name:'goldriver365',id:'goldriver365'}],posts:titles.map((title,i)=>({id:crypto.randomUUID(),title,series:'음식장사, 기본부터 다시',body:'',date:'',status:'계획',blogs:['goldriver365'],photos:[],count:3,keywords:''}))};let selected=data.posts[0]?.id,tab='원고 작업',key='',candidates=[],seriesFilter='';
const channels=[{key:'food',name:'식당·자영업',id:'gold365-100'},{key:'issues',name:'오늘의 이슈·용어설명',id:'goldriver365'},{key:'entertainment',name:'연예계 이슈',id:''},{key:'bulbaek',name:'화산불백 홍보',id:''}];let channel='food';
if(!data.channelVersion){for(const c of channels.filter(c=>c.id)){if(!data.blogs.some(b=>b.id===c.id))data.blogs.push({id:c.id,name:c.name})}for(const p of data.posts){p.channel=p.topicType==='general'?'issues':'food';if(p.channel==='food')p.blogs=p.blogs.map(id=>id==='goldriver365'?'gold365-100':id)}data.channelVersion=1}
const bulbaekPlan=[["화산불백, 불로 굽고 밥으로 완성하다", "화산불백, 직화불백"], ["화산불백은 어떤 음식인가요?", "불백덮밥, 돼지불백"], ["2013년부터 이어온 한식덮밥 경험, 화산불백의 시작", "화산불백, 한식덮밥"], ["고추장 화산불백, 매콤한 양념에 직화의 불향을 더하다", "고추장불백, 매콤한덮밥"], ["혼자 먹는 한 끼에도 든든함이 필요한 이유", "혼밥메뉴, 불백덮밥"], ["고추장에 버터를 더하면? 고추장버터 화산불백", "고추장버터화산불백, 버터불백"], ["화산불백은 어떤 창업자를 위한 브랜드인가", "화산불백창업, 음식점창업"], ["맵지 않은 한 그릇, 직화간장 화산불백", "간장불백, 직화덮밥"], ["화산불백이 마늘향부터 만드는 이유", "불백조리, 마늘향"], ["불백과 쌀국수, 함께 먹으면 어떤 맛일까", "불백쌀국수, 덮밥세트"], ["작은 식당 창업, 평수보다 먼저 살펴볼 것", "소규모식당창업, 소자본음식점창업"], ["매운맛이 당기는 날, 매운 고추장 화산불백", "매운불백, 매운덮밥"], ["점심 메뉴를 고를 때 맛만큼 중요한 세 가지", "직장인점심, 점심덮밥"], ["대학가에서 쌓은 한식덮밥 운영 경험", "대학가덮밥, 화산불백"], ["음식점 업종변경, 기존 주방에서 무엇을 활용할 수 있을까", "음식점업종변경, 식당리모델링"], ["돼지고기와 우삼겹, 오늘은 어떤 한 그릇을 고를까", "돼지불백, 우삼겹덮밥"], ["불백은 왜 고기를 굽고 소스를 입힐까", "직화불백, 불백소스"], ["화산불백의 가맹비 무료, 다른 비용도 함께 확인하세요", "화산불백가맹비, 불백창업비용"], ["혼밥부터 두 사람의 식사까지, 불백 메뉴 고르는 법", "혼밥추천, 불백메뉴"], ["진한 불백 뒤에 맑은 쌀국수 한 숟갈", "불백세트, 쌀국수세트"], ["오래 운영할 식당을 고를 때 확인할 기준", "오래할수있는창업, 음식점창업"], ["불백 전문점, 메뉴 구성은 왜 중요할까", "불백전문점창업, 식당메뉴구성"], ["처음 만나는 화산불백, 취향별 메뉴 선택 가이드", "화산불백메뉴, 불백추천"], ["주방장비 직접 구매, 견적 전에 확인할 것", "식당주방장비, 음식점창업비용"], ["작은 매장의 주방 동선, 주문부터 한 그릇이 나오기까지", "소형식당동선, 덮밥전문점"], ["대학과 일반 상가에서 쌓은 경험을 한 그릇에 담다", "화산불백브랜드, 한식덮밥전문점"], ["부업으로 식당을 운영하려면 먼저 따져야 할 것", "부업창업, 식당운영"], ["화산불백, 이런 취향이라면 골라보세요", "화산불백, 고기덮밥"], ["화산불백 창업 상담에서 꼭 물어볼 질문", "화산불백창업상담, 불백가맹"], ["메뉴부터 창업까지, 화산불백이 궁금한 분께", "화산불백, 직화불백덮밥전문점"]];
const bulbaekBrief="화산불백 전용 홍보 원고. 슬로건: 불로 굽고, 밥으로 완성하다. 2013년부터 한식덮밥 운영 경험. 메뉴·브랜드·창업 중 해당 주제에 집중. 본문 1000~1500자, 관련 해시태그 5~8개. 메뉴 안내 또는 창업 상담은 bulbaek.com으로 연결. 가맹비 무료와 별도 비용 구분. 확인되지 않은 가격·매출·수익·회수기간이나 고객 후기는 만들지 않는다. 사진은 제공된 실제 메뉴·매장·조리 사진만 사용하며 색감·질감을 변경하지 않는다.";
if(!data.bulbaekPlanVersion){for(const [i,row] of bulbaekPlan.entries()){if(!data.posts.some(p=>p.planKey==='bulbaek30-'+i))data.posts.push({id:crypto.randomUUID(),planKey:'bulbaek30-'+i,channel:'bulbaek',topicType:'bulbaek',title:row[0],seoKeywords:row[1],series:'화산불백 홍보 30일',brief:bulbaekBrief,body:'',date:'',status:'계획',blogs:data.bulbaekId?[data.bulbaekId]:[],photos:[],count:3,keywords:''})}data.bulbaekPlanVersion=1}
function setBulbaekId(v){v=v.trim();if(!/^[a-zA-Z0-9_-]+$/.test(v))return toast('블로그 아이디를 확인하세요.');const old=data.bulbaekId;data.bulbaekId=v;if(!data.blogs.some(b=>b.id===v))data.blogs.push({id:v,name:'화산불백 홍보'});for(const p of data.posts.filter(p=>p.channel==='bulbaek'))p.blogs=[...new Set([...p.blogs.filter(id=>id!==old),v])];render()}
function keywordHint(p){const t=p.topicType||p.channel||'food';return t==='bulbaek'?'예: 화산불백, 직화불백, 해당 메뉴명, 창업 주제':t==='issues'?'예: 글의 이슈명, 정책명, 설명할 용어':t==='entertainment'?'예: 글에 등장하는 인물명, 작품명, 행사명':t==='general'?'예: 글의 주제, 장소명, 핵심 개념':'예: 음식장사, 식당 창업, 음식점 운영, 식당 원가관리'}
function channelPosts(){return data.posts.filter(p=>(p.channel||(p.topicType==='general'?'issues':'food'))===channel)}
function switchChannel(v){channel=v;seriesFilter='';selected=channelPosts()[0]?.id;candidates=[];render()}
function channelInstruction(p){return p.topicType==='bulbaek'?bulbaekBrief:p.topicType==='issues'?'오늘의 이슈는 제공된 자료를 바탕으로 2~3가지로 정리하고 각각 무슨 일인지, 왜 중요한지, 핵심 요점을 설명하세요. 용어설명 요청이면 뜻, 쉬운 예시, 자주 혼동하는 개념을 설명하세요.':p.topicType==='entertainment'?'연예계 이슈를 제공된 기사나 공식 발표 자료를 바탕으로 정리하세요. 사실과 당사자의 주장, 미확인 내용을 구분하고 루머나 사생활 추측을 만들지 마세요.':''}
function setEntertainmentId(v){v=v.trim();if(!/^[a-zA-Z0-9_-]+$/.test(v))return toast('블로그 아이디를 확인하세요.');data.entertainmentId=v;if(!data.blogs.some(b=>b.id===v))data.blogs.push({id:v,name:'연예계 이슈'});render()}
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),current=()=>data.posts.find(p=>p.id===selected),safeImage=s=>/^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(String(s))?s:safeURL(s),safeURL=s=>{try{let u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return ''}};
function save(){try{localStorage.setItem('blog-manager-v1',JSON.stringify(data));return true}catch{toast('저장 공간이 부족합니다. 백업 후 사용하지 않는 글이나 사진을 삭제하세요.');return false}}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}function setTab(t){tab=t;render()}function render(){save();$('stats').innerHTML=[['전체 계획',data.posts.length],['검토할 원고',data.posts.filter(p=>p.body&&p.status!=='게시 완료').length],['네이버 예약 확인',data.posts.filter(p=>p.status==='네이버 예약 확인').length]].map(([s,n])=>`<div class="stat">${s}<strong>${n}</strong></div>`).join('');$('nav').innerHTML=['원고 작업','발행 일정','블로그·설정'].map(t=>`<button class="${tab===t?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');if(tab==='원고 작업')editor();else if(tab==='발행 일정')schedule();else settings()}
function editor(){let p=current();$('view').innerHTML=`<div class="layout"><aside class="panel"><h3>블로그별 글쓰기</h3>${channels.map(c=>`<button class="item ${channel===c.key?'selected':''}" onclick="switchChannel('${c.key}')">${esc(c.name)}<small>${esc(c.id||(c.key==='bulbaek'?data.bulbaekId:data.entertainmentId)||'아이디 미등록')}</small></button>`).join('')}${channel==='bulbaek'?`<label>화산불백 블로그 아이디</label><input value="${esc(data.bulbaekId||'')}" placeholder="네이버 블로그 아이디" onchange="setBulbaekId(this.value)"><p class="muted">30일 주제 계획입니다. 발행 날짜는 개별 지정하세요. 실제 메뉴·매장 사진을 직접 첨부하세요.</p>`:''}${channel==='entertainment'?`<label>연예계 블로그 아이디</label><input value="${esc(data.entertainmentId||'')}" placeholder="네이버 블로그 아이디" onchange="setEntertainmentId(this.value)">`:''}<h3>연재 계획 · ${channelPosts().length}편</h3><button class="primary" onclick="addPost()">＋ 새 글·원고 넣기</button><label>연재별 보기</label><select onchange="seriesFilter=this.value;editor()"><option value="">전체 글</option><option value="__single" ${seriesFilter==='__single'?'selected':''}>단독 글</option>${seriesNames().map(name=>`<option value="${esc(name)}" ${seriesFilter===name?'selected':''}>${esc(name)}</option>`).join('')}</select><div class="list">${channelPosts().filter(p=>!seriesFilter||(seriesFilter==='__single'?!p.series:p.series===seriesFilter)).map((p,i)=>`<button class="item ${p.id===selected?'selected':''}" onclick="selectPost('${p.id}')">${i+1}. ${esc(p.title)}<small>${esc(p.date?p.date.replace('T',' '):'발행일 미정')} · ${esc(p.status)}</small></button>`).join('')}</div></aside><section class="panel">${p?`<label>시리즈 · 비워두면 단독 글</label><input list="seriesNames" value="${esc(p.series)}" onchange="update('series',this.value)"><datalist id="seriesNames">${seriesNames().map(name=>`<option value="${esc(name)}">`).join('')}</datalist><label>글 유형</label><select onchange="update('topicType',this.value)"><option value="bulbaek" ${p.topicType==='bulbaek'?'selected':''}>화산불백 홍보</option><option value="food" ${(p.topicType||'food')==='food'?'selected':''}>음식장사·외식업</option><option value="general" ${p.topicType==='general'?'selected':''}>다른 주제·자유 글</option><option value="issues" ${p.topicType==='issues'?'selected':''}>오늘의 이슈·용어설명</option><option value="entertainment" ${p.topicType==='entertainment'?'selected':''}>연예계 이슈</option></select><label>글에 담을 내용 · AI 작성 시 참고</label><textarea style="min-height:90px" maxlength="1000" placeholder="글에 담을 내용 또는 확인한 기사 날짜·출처 URL·핵심 내용을 넣으세요. 이슈를 자동 검색하는 기능은 아직 없습니다." onchange="update('brief',this.value)">${esc(p.brief||'')}</textarea><label>글 제목</label><input value="${esc(p.title)}" onchange="update('title',this.value)"><label>네이버 핵심 검색어 · 쉼표로 구분, 최대 5개</label><input maxlength="300" value="${esc(p.seoKeywords||'')}" placeholder="${esc(keywordHint(p))}" onchange="update('seoKeywords',this.value)"><p class="muted">비워두면 해당 분야와 원고 주제에 맞는 핵심 검색어 3~5개를 AI가 선택합니다. 직접 입력하면 첫 검색어를 중심으로 제목·도입·소제목·본문에 자연스럽게 반영합니다. 실제 검색량 조회나 상위 노출 보장은 아닙니다.</p><div id="keywordStatus" class="notice">${keywordReport(p)}</div><div class="row"><div><label>발행 예정일 · 한국시간</label><input type="datetime-local" value="${esc(p.date)}" onchange="update('date',this.value)"></div><div><label>현재 상태</label><select onchange="update('status',this.value)">${['계획','원고 작성','검토 완료','네이버 예약 확인','게시 완료'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><label>발행 대상</label>${data.blogs.map(b=>`<label style="display:inline-block;margin-right:18px"><input style="width:auto" type="checkbox" ${p.blogs.includes(b.id)?'checked':''} onchange="toggleBlog('${b.id}',this.checked)"> ${esc(b.name)}</label>`).join('')}<div class="actions"><button class="primary" id="cloudGenerate" onclick="cloudAI()">OpenAI로 원고 생성</button><button onclick="copyPrompt()">AI 작성 지시문 복사</button><button onclick="localAI()">로컬 AI 연결 후 생성</button><button onclick="copyText('title')">제목 복사</button><button onclick="copyText('body')">본문 복사</button></div><p class="muted">OpenAI 생성은 서버 연결을 사용합니다. 생성 비용은 API 사용량에 따라 발생합니다. 로컬 AI 생성은 설정한 Ollama에 연결될 때만 실행됩니다.</p><label>본문 · 관련 해시태그 5개 이상 포함</label><textarea id="body" oninput="current().body=this.value;save();if($('keywordStatus'))$('keywordStatus').innerHTML=keywordReport(current())" placeholder="작성한 원고를 붙여넣거나 로컬 AI로 생성하세요.">${esc(p.body)}</textarea><div class="actions"><button onclick="cleanBody()">서식 기호 정리</button><button onclick="preview()">사진 포함 미리보기</button><button onclick="exportPost()">사진 포함 HTML 내려받기</button></div><hr style="border:0;border-top:1px solid #e4ebed"><h3>내용에 맞는 사진</h3><div class="notice"><strong>내 사진 직접 넣기</strong><label>사진 파일 선택 · 여러 장 선택 가능</label><input type="file" accept="image/jpeg,image/png,image/webp" multiple onchange="uploadPhotos(this.files);this.value=''" aria-label="사진 파일 업로드"><div class="actions"><button onclick="pastePhotos()">클립보드 사진 붙여넣기</button></div><div tabindex="0" role="textbox" aria-label="사진 붙여넣기 영역" onpaste="pastePhotoEvent(event)" style="border:2px dashed #8bbbad;padding:16px;border-radius:10px;cursor:text">사진을 복사한 뒤 이 영역을 클릭하고 Ctrl+V를 누르세요.</div><p class="muted">JPG·PNG·WebP, 글당 선택한 사진 수까지 첨부됩니다. 파일은 서버로 보내지 않고 이 브라우저에 저장합니다. 저장 용량을 줄이기 위해 긴 변 1600px 이하 JPEG로 변환하므로 원본은 별도로 보관하세요.</p></div><div class="row"><div><label>사진 수</label><select onchange="update('count',Number(this.value))"><option value="2" ${p.count===2?'selected':''}>2장</option><option value="3" ${p.count===3?'selected':''}>3장</option></select></div><div><label>검색어 · 비워두면 글 내용에서 자동 선택</label><input value="${esc(p.keywords)}" onchange="update('keywords',this.value)"></div></div><div class="actions"><button onclick="searchPhotos()">무료 사진 검색</button><button class="primary" onclick="searchPhotos(true)">사진 2~3장 자동 검색·배치</button></div><p class="muted">추가 API 키 없이 Wikimedia Commons에서 검색합니다. 관련 문단에 2~3장을 배치하고 저작자·출처·이용 조건을 표시합니다. 검색어는 영어로 직접 바꿀 수 있습니다. 게시 전 원본 이용 조건과 내용 적합성을 확인하세요.</p><div class="photos" id="photos">${p.photos.map((ph,i)=>photoCard(ph,i,true)).join('')}</div><h4 id="candidateTitle"></h4><div class="photos" id="candidates"></div><div class="actions">${p.blogs.map(b=>`<a href="https://blog.naver.com/${encodeURIComponent(b)}?Redirect=Write" target="_blank" rel="noopener"><button>네이버 글쓰기 열기 · ${esc(b)}</button></a>`).join('')}<button onclick="deletePost()">글 삭제</button></div><p class="muted">네이버에서 실제 예약을 등록한 뒤 상태를 ‘네이버 예약 확인’으로 바꾸세요. 이 프로그램은 네이버에 게시 요청을 보내지 않습니다.</p>`:'글 계획을 추가하세요.'}</section></div>`}
function selectPost(id){selected=id;candidates=[];render()}function update(k,v){current()[k]=v;render()}function toggleBlog(id,on){let p=current();p.blogs=on?[...new Set([...p.blogs,id])]:p.blogs.filter(x=>x!==id);save()}function seriesNames(){return [...new Set(channelPosts().map(p=>p.series).filter(Boolean))]}
function addPost(){const d=document.createElement('dialog');d.style.cssText='max-width:650px;width:90%;border:0;border-radius:15px;padding:24px';d.innerHTML=`<form id="newPostForm"><h2>새 글·원고 넣기</h2><label>제목</label><input name="title" maxlength="300" placeholder="글 제목" required><label>시리즈 · 새 이름 입력 또는 기존 연재 선택</label><input name="series" list="newSeriesNames" maxlength="300" placeholder="예: 나의 여행 이야기 · 비워두면 단독 글"><datalist id="newSeriesNames">${seriesNames().map(name=>`<option value="${esc(name)}">`).join('')}</datalist><label>글 유형</label><select name="topicType">${channel==='bulbaek'?'<option value="bulbaek">화산불백 홍보</option>':channel==='food'?'<option value="food">음식장사·외식업</option>':channel==='issues'?'<option value="issues">오늘의 이슈·용어설명</option>':'<option value="entertainment">연예계 이슈</option>'}<option value="general">다른 주제·자유 글</option></select><label>이미 작성한 원고 · 붙여넣기</label><textarea name="body" style="min-height:220px" placeholder="원고를 붙여넣으세요. 비워두면 AI로 작성할 수 있습니다."></textarea><label>텍스트 파일 불러오기 · TXT</label><input type="file" accept=".txt,text/plain" id="manuscriptFile"><div class="actions"><button type="button" onclick="this.closest('dialog').remove()">취소</button><button type="submit" class="primary">글 저장</button></div></form>`;document.body.append(d);d.querySelector('#manuscriptFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>200000)return alert('텍스트 파일은 200KB 이하로 선택하세요.');d.querySelector('[name=body]').value=await f.text()};d.querySelector('form').onsubmit=e=>{e.preventDefault();const form=new FormData(e.target);const body=String(form.get('body')||'');const p={id:crypto.randomUUID(),title:String(form.get('title')).trim(),series:String(form.get('series')||'').trim(),channel,topicType:String(form.get('topicType')),body,date:'',status:body.trim()?'원고 작성':'계획',blogs:[channels.find(c=>c.key===channel).id||(channel==='bulbaek'?data.bulbaekId:data.entertainmentId)].filter(Boolean),photos:[],count:3,keywords:'',seoKeywords:'',brief:channel==='bulbaek'?bulbaekBrief:''};if(!p.title)return;data.posts.push(p);if(!save()){data.posts.pop();return}selected=p.id;seriesFilter='';candidates=[];d.remove();render();toast('새 글을 저장했습니다.')};d.showModal()}
function deletePost(){if(confirm('이 글 계획과 원고를 삭제할까요?')){data.posts=data.posts.filter(p=>p.id!==selected);selected=data.posts[0]?.id;render()}}
function seoTerms(p){return [...new Set((p.seoKeywords||'').split(',').map(x=>x.trim()).filter(Boolean))].slice(0,5)}
function keywordReport(p){const terms=seoTerms(p);if(!terms.length)return '핵심 검색어를 입력하면 원고의 포함 여부를 확인합니다.';const title=p.title||'',body=p.body||'';return terms.map(term=>{const count=body.split(term).length-1;return esc(term)+' · 제목 '+(title.includes(term)?'포함':'미포함')+' · 본문 '+count+'회'}).join('<br>')}
function promptFor(p){return `${p.topicType!=='food'&&p.topicType?'지정한 주제의 한국어 블로그 원고를 작성하세요. 음식장사 내용으로 주제를 바꾸지 마세요.':'한국 자영업 음식장사 블로그 원고를 작성하세요.'}\n${channelInstruction(p)} 최신 기사나 사건은 참고 자료에 있는 사실만 사용하고 날짜와 출처를 표시하세요. 자료가 없으면 최신 사건을 지어내지 말고 자료가 필요하다고 알리세요.\n시리즈: ${p.series}\n주제: ${p.title}\n네이버 핵심 검색어: ${seoTerms(p).join(', ')||'별도 지정 없음'}\n검색어가 없으면 이 글의 분야와 실제 주제에 맞는 구체적인 핵심 검색어 3~5개를 선택하여 제목과 본문에 자연스럽게 반영하세요. 검색어 목록을 본문 앞에 따로 출력하지 마세요. 검색어가 지정되면 첫 검색어를 중심으로 기존 주제를 유지한 제목을 첫 줄에 쓰고, 도입·관련 소제목·본문에 검색어를 자연스럽게 반영하세요. 억지 반복이나 무관한 키워드 나열은 하지 마세요.\n참고 내용: ${p.brief||'별도 지정 없음'}\n${p.topicType==='general'?'대상과 구성은 주제에 맞게 정하세요.':'대상: 예비 창업자와 식당 운영자. 맛·원가·공정·서비스 속도를 고려한 현장 중심 설명.'} 확인되지 않은 개인 경험이나 통계는 만들지 마세요. 가정 수치는 예시라고 표시하세요. 제목, 도입, 4~5개 소제목, 오늘 할 일 3가지, 다음 편 안내를 포함하세요. 본문 약 1500~2200자. 짧은 문단, 자연스러운 한국어. 제목·소제목에는 마크다운 #·별표·역슬래시를 쓰지 말고 일반 텍스트로 출력하세요. 본문 맨 마지막에 글의 실제 내용과 연관된 서로 다른 해시태그를 반드시 5~8개 작성하세요. 해시태그에만 #을 붙이고 띄어쓰기 없이 한 줄로 나열하세요. 무관한 인기 태그는 넣지 마세요. 사진 ${p.count}장을 놓을 수 있도록 주제를 명확히 구분하세요.`}async function copy(s){try{await navigator.clipboard.writeText(s);toast('복사했습니다.')}catch{toast('복사 권한을 허용하거나 텍스트를 직접 선택하세요.')}}function copyPrompt(){copy(promptFor(current()))}function copyText(k){copy(current()[k])}function cleanBody(){current().body=current().body.replace(/^[ \t]*#{1,6}[ \t]+/gm,'').replace(/\*\*/g,'').replace(/\\(?=[#*\s]|$)/gm,'');render();toast('제목·굵기 서식 기호를 정리했습니다.')}
async function localAI(){let p=current(),id=p.id;const endpoint=localStorage.getItem('ollama-url')||'http://localhost:11434';const model=localStorage.getItem('ollama-model')||'qwen3:8b';if(p.body&&!confirm('기존 본문을 새 원고로 교체할까요?'))return;toast('로컬 AI 연결과 모델을 확인 중입니다.');try{await checkAI(endpoint,model);toast('원고 생성 중입니다. 컴퓨터 성능에 따라 몇 분 걸릴 수 있습니다.');let r=await fetch(endpoint.replace(/\/$/,'')+'/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,prompt:promptFor(p),stream:false}),signal:AbortSignal.timeout(180000)});if(!r.ok){let error=await r.json().catch(()=>({}));throw Error(error.error||('AI 응답 오류 '+r.status))}let j=await r.json();if(!j.response)throw Error('생성된 본문 없음');const target=data.posts.find(x=>x.id===id);if(target){target.body=j.response.replace(/<think>[\s\S]*?<\/think>/g,'').trim();target.status='원고 작성';save();render()}toast('원고가 생성됐습니다. 내용을 검토하세요.')}catch(e){aiError(e)}}
function photoCard(ph,i,attached){const local=ph.provider==='직접 첨부';return `<div class="photo"><img src="${esc(safeImage(ph.src))}" alt="${esc(ph.alt||'참고 사진')}" loading="lazy"><p class="muted">${esc(local?ph.alt:ph.photographer)} · ${esc(local?'직접 첨부':ph.licenseName||'Pexels License')}</p>${local?`<button onclick="downloadLocalPhoto(${i})">사진 저장</button>`:`<a target="_blank" rel="noopener" href="${esc(safeURL(ph.url))}">원본·출처</a> · <a target="_blank" rel="noopener" href="${esc(safeURL(ph.license))}">이용 조건</a>`} <button onclick="${attached?'removePhoto':'attachPhoto'}(${i})">${attached?'삭제':'선택'}</button>${attached?`<label>본문 삽입 위치</label><select onchange="photoPosition(${i},this.value)"><option value="" ${!Number.isInteger(ph.afterParagraph)?'selected':''}>고른 위치에 자동 배치</option>${current().body.split(/\n\s*\n/).filter(x=>x.trim()).map((_,n)=>`<option value="${n}" ${ph.afterParagraph===n?'selected':''}>${n+1}번째 문단 뒤</option>`).join('')}</select>`:''}</div>`}
function photoPosition(i,value){current().photos[i].afterParagraph=value===''?undefined:Number(value);save()}
function downloadLocalPhoto(i){const ph=current().photos[i];if(!ph||ph.provider!=='직접 첨부')return;const a=document.createElement('a');a.href=safeImage(ph.src);a.download='blog-photo-'+(i+1)+'.jpg';a.click()}
let uploadBusy=false;
async function encodePhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPG·PNG·WebP 사진만 지원합니다.');if(file.size>20*1024*1024)throw Error('사진 한 장은 20MB 이하로 선택하세요.');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let src=canvas.toDataURL('image/jpeg',0.82);if(src.length>700000)src=canvas.toDataURL('image/jpeg',0.6);if(src.length>1000000)throw Error('사진 용량이 큽니다. 크기를 줄여 다시 선택하세요.');return src}finally{URL.revokeObjectURL(url)}}
async function uploadPhotos(files){if(uploadBusy)return;const p=current();if(!p)return;const list=Array.from(files||[]);if(!list.length)return toast('사진 파일을 선택하세요.');if(p.photos.length>=p.count)return toast('사진이 가득 찼습니다. 기존 사진을 삭제한 뒤 첨부하세요.');uploadBusy=true;let added=0,errors=[];try{for(const file of list){if(p.photos.length>=p.count)break;try{const src=await encodePhoto(file);if(!data.posts.includes(p))break;p.photos.push({id:crypto.randomUUID(),src,alt:file.name||'붙여넣은 사진',provider:'직접 첨부',photographer:'',keyword:''});if(!save()){p.photos.pop();throw Error('브라우저 저장 공간 부족. 백업 후 불필요한 사진을 삭제하세요.')}added++}catch(e){errors.push(e.message)}}if(selected===p.id)render();toast('사진 '+added+'장 저장했습니다.');if(list.length>added&&!errors.length)toast('선택한 사진 수까지만 저장했습니다.');if(errors.length)alert([...new Set(errors)].join('\n'))}finally{uploadBusy=false}}
function pastePhotoEvent(event){const files=Array.from(event.clipboardData?.items||[]).filter(x=>x.kind==='file'&&x.type.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);event.preventDefault();if(files.length)uploadPhotos(files);else toast('사진 자체를 복사하세요. 웹주소나 글자는 사진으로 첨부되지 않습니다.')}
async function pastePhotos(){try{if(!navigator.clipboard?.read)throw Error();const items=await navigator.clipboard.read();const files=[];for(const item of items){const type=item.types.find(t=>['image/png','image/jpeg','image/webp'].includes(t));if(type){const blob=await item.getType(type);files.push(new File([blob],'붙여넣은 사진.'+type.split('/')[1],{type}))}}if(!files.length)return toast('클립보드에 사진이 없습니다.');await uploadPhotos(files)}catch{toast('사진 붙여넣기 영역을 클릭한 뒤 Ctrl+V를 누르세요.')}}
let photosBusy=false;
async function searchPhotos(auto=false,targetId=selected){if(photosBusy)return;const p=data.posts.find(x=>x.id===targetId);if(!p)return;if(p.topicType==='bulbaek')return toast('화산불백 홍보에는 제공된 실제 사진을 파일 업로드 또는 붙여넣기로 첨부하세요.');if(auto&&p.photos.filter(ph=>ph.provider==='직접 첨부').length>=p.count)return toast('직접 넣은 사진을 유지합니다.');photosBusy=true;toast('글 내용에 맞는 무료 사진을 검색 중입니다.');try{const status=await fetch('/api/ai/status');const info=await status.json();if(!status.ok)throw Error(info.error);if(!info.authorized&&!await managerLogin())return;const r=await fetch('/api/photos/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:p.title,body:p.body,count:p.count,keywords:p.keywords}),signal:AbortSignal.timeout(40000)});const j=await r.json();if(!r.ok)throw Error(j.error||'검색 실패');const found=j.photos||[];if(auto&&found.length){const used=new Set();const local=p.photos.filter(ph=>ph.provider==='직접 첨부');p.photos=[...local,...found.filter(ph=>{if(used.has(ph.keyword))return false;used.add(ph.keyword);return true}).slice(0,Math.max(0,p.count-local.length))];save()}if(selected===targetId){candidates=found;render();$('candidateTitle').textContent='검색된 후보 '+found.length+'장';$('candidates').innerHTML=found.map((ph,i)=>photoCard(ph,i,false)).join('')}toast(auto?'사진 '+p.photos.length+'장 배치 완료. 미리보기에서 확인하세요.':'사진 후보 '+found.length+'장을 찾았습니다.');if(j.warnings?.length)alert('일부 사진 검색에 실패했습니다: '+j.warnings.join(', '));if(!found.length)alert('이용 조건을 확인할 수 있는 사진을 찾지 못했습니다. 검색어를 영어로 바꾸어 다시 검색하세요.')}catch(e){alert('사진 검색 실패: '+(e.message||'연결 오류')+'. 원고는 그대로 저장되어 있습니다.')}finally{photosBusy=false}}
function attachPhoto(i){const ph=candidates[i],p=current();if(!ph)return;if(p.photos.length>=p.count)return toast('최대 '+p.count+'장까지 선택할 수 있습니다.');if(!p.photos.some(x=>x.id===ph.id))p.photos.push(ph);render()}
function removePhoto(i){current().photos.splice(i,1);render()}
async function autoPhotos(){if(!candidates.length)return searchPhotos(true);const used=new Set(),p=current();p.photos=candidates.filter(ph=>{if(used.has(ph.keyword))return false;used.add(ph.keyword);return true}).slice(0,p.count);render();toast('사진을 관련 문단에 배치했습니다. 미리보기를 확인하세요.')}
function article(p){let paras=p.body.split(/\n\s*\n/).filter(s=>s.trim()),photos=p.photos.slice(0,p.count);let positions=photos.map((ph,i)=>Number.isInteger(ph.afterParagraph)?Math.max(0,Math.min(paras.length-1,ph.afterParagraph)):(i===0?0:Math.min(paras.length-1,Math.floor(paras.length*i/photos.length))));let html='<article class="preview"><h2>'+esc(p.title)+'</h2><p>'+esc(p.series)+'</p>';paras.forEach((s,i)=>{html+='<p>'+esc(s)+'</p>';photos.forEach((ph,j)=>{if(positions[j]===i)html+=`<figure><img src="${esc(safeImage(ph.src))}" alt="${esc(ph.alt)}"><figcaption>${ph.provider==='직접 첨부'?esc(ph.alt||'직접 첨부 사진'):`<a href="${esc(safeURL(ph.url))}">사진: ${esc(ph.photographer)} / ${esc(ph.provider||'Pexels')}</a> · ${esc(ph.title||ph.alt||'사진')} · <a href="${esc(safeURL(ph.license))}">${esc(ph.licenseName||'Pexels License')}</a> · 원본 사용`}</figcaption></figure>`})});if(!paras.length)html+='<p>본문을 작성하면 사진이 배치됩니다.</p>';return html+'</article>'}function preview(){let dlg=document.createElement('dialog');dlg.style.cssText='max-width:850px;width:95%;border:0;border-radius:15px;padding:25px';dlg.innerHTML='<button onclick="this.closest(\'dialog\').remove()">닫기</button>'+article(current());document.body.append(dlg);dlg.showModal()}function download(name,s,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([s],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportPost(){download('blog-post.html','<!doctype html><meta charset="utf-8"><style>body{max-width:760px;margin:40px auto;font:17px/1.9 sans-serif;padding:20px}p{white-space:pre-wrap}img{max-width:100%}</style>'+article(current()),'text/html');toast('직접 첨부한 사진은 HTML에 포함됩니다. 검색 사진은 온라인 주소로 연결됩니다. 네이버에는 사진을 별도로 첨부하세요.')}function backup(){download('blog-manager-backup.json',JSON.stringify(data,null,2),'application/json')}
function schedule(){let list=[...data.posts].sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));$('view').innerHTML='<section class="panel"><h2>발행 일정</h2><p class="muted">한국시간 기준 · 일정은 계획이며 네이버 예약을 자동 등록하지 않습니다.</p><table><thead><tr><th>예정일</th><th>글 제목</th><th>상태</th></tr></thead><tbody>'+list.map(p=>`<tr><td>${esc(p.date?p.date.replace('T',' '):'미정')}</td><td><button onclick="tab='원고 작업';selectPost('${p.id}')">${esc(p.title)}</button></td><td><span class="badge">${esc(p.status)}</span></td></tr>`).join('')+'</tbody></table></section>'}
function settings(){$('view').innerHTML=`<div class="layout"><section class="panel"><h2>내 블로그</h2>${data.blogs.map((b,i)=>`<p>${esc(b.name)} · ${esc(b.id)} <button onclick="removeBlog(${i})">삭제</button></p>`).join('')}<label>블로그 이름</label><input id="blogName" placeholder="음식장사 이야기"><label>네이버 블로그 아이디</label><input id="blogId" placeholder="goldriver365"><div class="actions"><button class="primary" onclick="addBlog()">블로그 등록</button></div><p class="muted">최대 10개 · 네이버 계정 비밀번호를 수집하지 않습니다.</p></section><section class="panel"><h2>연결과 데이터</h2><h3>OpenAI 서버 연결</h3><div id="cloudStatus" class="notice" role="status">연결 확인 버튼을 누르세요.</div><div class="actions"><button onclick="cloudStatus()">OpenAI 연결 확인</button><button onclick="managerLogin()">관리자 로그인</button><button onclick="managerLogout()">로그아웃</button></div><p class="muted">API 키는 Netlify → Project configuration → Environment variables에서 OPENAI_API_KEY로 등록하고 다시 배포합니다. BLOG_MANAGER_PASSWORD에는 12자 이상 별도 관리자 비밀번호를 등록하세요. 이 화면이나 채팅에 입력하지 마세요. 키 등록 여부 확인은 유료 생성 요청을 보내지 않습니다.</p><h3>무료 사진 자동 연결</h3><p class="muted">Wikimedia Commons 연결 · 사진 API 키 등록 없이 사용합니다. 원고 생성 후 사진을 자동 검색하고 관련 문단에 배치합니다. 기존 원고는 원고 작업의 ‘사진 2~3장 자동 검색·배치’를 누르세요.</p><label>무료 로컬 AI 주소 · Ollama</label><input id="aiURL" value="${esc(localStorage.getItem('ollama-url')||'http://localhost:11434')}"><label>설치된 모델 이름</label><input id="aiModel" value="${esc(localStorage.getItem('ollama-model')||'qwen3:8b')}"><div class="actions"><button onclick="setAI()">로컬 AI 설정 저장</button><button class="primary" onclick="testAI()">연결 테스트 · 모델 확인</button></div><p class="muted">별도 컴퓨터에 Ollama와 모델 설치가 필요합니다. 외부 사이트에서 로컬 서버로 연결하려면 브라우저 권한과 Ollama CORS 설정이 필요할 수 있습니다. 이 사이트가 닫힌 동안에는 원고를 생성하지 않습니다.</p><div id="aiResult" class="notice" role="status">아직 연결을 확인하지 않았습니다.</div><details style="margin:18px 0;line-height:1.9"><summary>Windows 설치·연결 방법</summary><p>1. <a href="https://ollama.com/download/windows" target="_blank" rel="noopener">Ollama 설치</a> 후 실행하세요.</p><p>2. 명령 프롬프트에서 ollama list 를 실행하여 설치된 모델 이름을 확인하세요. 모델이 없다면 ollama pull qwen3:8b 로 다운로드할 수 있습니다. 용량과 메모리 요구량을 먼저 확인하세요.</p><p>3. Windows 사용자 환경 변수 OLLAMA_ORIGINS 값에 ${esc(location.origin)} 를 추가하고 Ollama를 완전히 종료 후 다시 실행하세요.</p><p>4. 브라우저에서 요청하는 로컬 네트워크 접근 권한을 허용한 뒤 연결 테스트를 누르세요.</p><p>설치가 어렵다면 원고 작업의 AI 작성 지시문을 복사해 ChatGPT에서 원고를 만든 뒤 붙여넣을 수 있습니다.</p></details><label>백업 복원</label><input type="file" accept="application/json" onchange="restore(this.files[0])"><p class="muted">브라우저 데이터를 삭제하면 원고가 사라집니다. 주기적으로 백업하세요. 다른 기기로 자동 동기화되지는 않습니다.</p></section></div>`}function setAI(){try{let u=new URL($('aiURL').value);if(!['http:','https:'].includes(u.protocol))throw Error();localStorage.setItem('ollama-url',u.href);localStorage.setItem('ollama-model',$('aiModel').value.trim());toast('로컬 AI 설정을 저장했습니다.')}catch{toast('올바른 HTTP 주소를 입력하세요.')}}function addBlog(){let id=$('blogId').value.trim(),name=$('blogName').value.trim()||id;if(!/^[a-zA-Z0-9_-]+$/.test(id))return toast('블로그 아이디를 확인하세요.');if(data.blogs.length>=10)return toast('최대 10개까지 등록할 수 있습니다.');if(data.blogs.some(b=>b.id===id))return toast('이미 등록된 블로그입니다.');data.blogs.push({id,name});render()}function removeBlog(i){let id=data.blogs[i].id;data.blogs.splice(i,1);data.posts.forEach(p=>p.blogs=p.blogs.filter(b=>b!==id));render()}async function restore(file){if(!file)return;try{let j=JSON.parse(await file.text());if(!Array.isArray(j.posts)||!Array.isArray(j.blogs)||j.blogs.length>10||j.posts.length>1000||!j.posts.every(p=>typeof p.id==='string'&&typeof p.title==='string'&&typeof p.body==='string'&&Array.isArray(p.photos)&&Array.isArray(p.blogs)))throw Error();if(!confirm('현재 데이터 대신 백업을 복원할까요?'))return;data=j;selected=data.posts[0]?.id;render();toast('복원했습니다.')}catch{toast('올바른 블로그매니저 백업 파일이 아닙니다.')}}
async function checkAI(endpoint,model){let r=await fetch(endpoint.replace(/\/$/,'')+'/api/tags',{signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error('연결 오류 HTTP '+r.status);let j=await r.json();let names=(j.models||[]).map(m=>m.name);if(!names.length)throw Error('연결은 됐지만 설치된 모델이 없습니다. Ollama에서 모델을 다운로드하세요.');if(model&&!names.some(n=>n===model||n===model+':latest'))throw Error('설정한 모델이 없습니다. 설치된 모델: '+names.join(', '));return names}
function aiError(e){const network=e instanceof TypeError||e.name==='TimeoutError';const msg=network?'로컬 AI에 연결할 수 없습니다. Ollama 실행 여부, 주소, 사이트 허용 설정(OLLAMA_ORIGINS), 브라우저 로컬 네트워크 권한을 확인하세요. 이 오류만으로 정확한 원인을 구분할 수는 없습니다.':e.message;let el=$('aiResult');if(!el){tab='블로그·설정';render();el=$('aiResult')}el.textContent=msg;toast('생성되지 않았습니다. 연결 안내를 확인하세요.')}
async function testAI(){setAI();const el=$('aiResult');el.textContent='연결 확인 중…';try{const names=await checkAI(localStorage.getItem('ollama-url')||'http://localhost:11434');el.textContent='연결 성공 · 설치된 모델: '+names.join(', ')+'. 사용할 이름을 모델 입력란에 넣으세요.'}catch(e){aiError(e)}}
render();

let cloudBusy=false;
function askManagerPassword(){return new Promise(resolve=>{const dialog=document.createElement('dialog');dialog.style.cssText='border:0;border-radius:14px;padding:26px;max-width:380px';dialog.innerHTML='<form method="dialog"><h3>관리자 로그인</h3><p>Netlify에 등록한 관리자 비밀번호를 입력하세요.</p><input type="password" name="password" autocomplete="current-password" placeholder="API 키를 입력하지 마세요" required><div class="actions"><button value="cancel" formnovalidate>취소</button><button class="primary" value="login">로그인</button></div></form>';document.body.append(dialog);dialog.addEventListener('close',()=>{const value=dialog.returnValue==='login'?dialog.querySelector('input').value:null;dialog.remove();resolve(value)},{once:true});dialog.showModal();dialog.querySelector('input').focus()})}
async function managerLogin(){const password=await askManagerPassword();if(password===null)return false;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const j=await r.json();if(!r.ok)throw Error(j.error||'로그인 실패');toast('관리자 로그인 완료');return true}catch(e){alert(e.message);return false}}
async function managerLogout(){try{const r=await fetch('/api/auth/logout',{method:'POST'});if(!r.ok)throw Error();toast('로그아웃했습니다.');if($('cloudStatus'))await cloudStatus()}catch{toast('로그아웃 요청 실패')}}
async function cloudStatus(){const el=$('cloudStatus');el.textContent='연결 확인 중…';try{let r=await fetch('/api/ai/status');let j=await r.json();if(!r.ok)throw Error(j.error);if(!j.authorized){if(!await managerLogin()){el.textContent='관리자 로그인이 필요합니다.';return}r=await fetch('/api/ai/status');j=await r.json();if(!r.ok)throw Error(j.error);if(!j.authorized)throw Error('로그인 쿠키가 저장되지 않았습니다. HTTPS 주소에서 다시 확인하세요.')}el.textContent=j.configured?'서버 API 키 등록됨 · 모델 '+j.model+' · 실제 호출 결과는 생성 시 확인됩니다.':'API 키 미등록 · Netlify 환경 변수 OPENAI_API_KEY에 등록한 뒤 다시 배포하세요.'}catch(e){el.textContent=e.message||'서버 연결 실패'}}
async function cloudAI(){if(cloudBusy)return;const p=current(),id=p.id;if(p.body&&!confirm('기존 본문을 새 원고로 교체할까요?'))return;cloudBusy=true;const btn=$('cloudGenerate');btn.disabled=true;btn.textContent='원고 생성 중…';try{const status=await fetch('/api/ai/status');const info=await status.json();if(!status.ok)throw Error(info.error);if(!info.authorized&&!await managerLogin())return;const r=await fetch('/api/ai/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:p.title,series:p.series,count:p.count,seoKeywords:p.seoKeywords||'',topicType:p.topicType||'food',brief:p.brief||''}),signal:AbortSignal.timeout(60000)});const j=await r.json();if(!r.ok)throw Error(j.error||'생성 실패');const target=data.posts.find(x=>x.id===id);if(target){target.body=j.text;if(seoTerms(target).length){const first=j.text.split('\n').map(s=>s.trim()).find(Boolean);if(first&&first.length<=150)target.title=first.replace(/^#+\s*/, '').replace(/\*\*/g,'')}target.status='원고 작성';save();render()}toast('원고 저장 완료. 사진을 자동 검색합니다.');if(target?.topicType==='bulbaek')toast('원고를 저장했습니다. 제공하신 실제 메뉴·매장 사진을 직접 첨부하세요.');else await searchPhotos(true,id)}catch(e){alert(e.name==='TimeoutError'?'응답 시간이 초과됐습니다. 서버 요청이 완료됐을 수 있으므로 즉시 반복하지 마세요.':e.message||'서버 연결 실패')}finally{cloudBusy=false;if($('cloudGenerate')){$('cloudGenerate').disabled=false;$('cloudGenerate').textContent='OpenAI로 원고 생성'}}}
</script></html>
